environment: development

llm:
  primary_provider: openai
  primary_model: gpt-4o
  fallback_provider: anthropic

research:
  primary_provider: serpapi
  fallback_provider: perplexity

image:
  primary_provider: openai
  primary_model: gpt-image-1-mini
  fallback_provider: null

session_store:
  backend: postgres
  url: ${SESSION_STORE_URL}   # Supabase pooler connection string
  # Alternative for fully-offline/no-external-DB use: backend: sqlite,
  # path: contentalchemy.db (relative to project root; override via
  # SESSION_STORE_PATH). Also supported: backend: memory (non-persistent,
  # mainly for tests — see SESSION_STORE_BACKEND env override).
  # Days a deleted session stays recoverable in the sidebar's Trash before
  # scripts/purge_deleted_sessions.py removes it for good (override via
  # SESSION_RETENTION_DAYS).
  retention_days: 14

logging:
  level: DEBUG
